<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f2ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MY LIFE ROUTINE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>MY LIFE ROUTINE</title>
<style>
:root{--bg:#f3f1e8;--card:#fffdf7;--ink:#354238;--muted:#788176;--line:#e4e2d5;--accent:#71866d;--accentlight:#e8eee3;--shadow:0 7px 24px #3d4b3d10}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 12% 0%,#e8ecdf 0,transparent 34%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:15px}
main{max-width:760px;margin:auto;padding:26px 16px 54px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding:18px 18px 20px;background:linear-gradient(135deg,#e7ecdf,#f6f1e7 72%);border:1px solid #dfe5d8;border-radius:22px;box-shadow:var(--shadow)}.eyebrow{font-size:10px;letter-spacing:.2em;color:#71816d}h1{font-size:23px;margin:6px 0 0;font-weight:650;letter-spacing:.02em}.date{text-align:right;color:var(--muted);font-size:12px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px}.days button{padding:11px 2px;border:1px solid var(--line);background:rgba(255,253,247,.92);border-radius:13px;color:var(--ink);font-size:13px;box-shadow:0 2px 8px #3d4b3d08}.days button.active{background:#71866d;color:#fffdf7;border-color:#71866d;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.card h2{font-size:16px;margin:0;font-weight:650}.sub{font-size:12px;color:var(--muted);line-height:1.6}
.chartwrap{display:flex;align-items:center;gap:14px}.chart{width:min(46vw,210px);flex-shrink:0}.legend{flex:1;min-width:0;font-size:12px}.leg{display:flex;align-items:center;gap:7px;margin:7px 0}.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}.leg span:nth-child(2){flex:1}.leg b{font-weight:600;white-space:nowrap}
.progress{height:8px;background:#e8e6dc;border-radius:20px;overflow:hidden;margin:10px 0}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#9caf91,#71866d);width:0;border-radius:20px}
.task{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{width:19px;height:19px;accent-color:var(--accent);flex-shrink:0}.task label{flex:1;line-height:1.4}.done{text-decoration:line-through;color:var(--muted)}
button,input,select{font:inherit}button{cursor:pointer}.btn{border:1px solid var(--line);background:#fffdf7;color:var(--ink);border-radius:12px;padding:9px 12px;font-size:13px}.primary{background:var(--accentlight);border-color:#cbd8c8;color:#435641}.smallbtn{padding:6px 9px;font-size:12px}
.schedule-row{display:grid;grid-template-columns:100px 10px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.schedule-row:last-child{border:0}.time{font-weight:650;font-variant-numeric:tabular-nums}.editform{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.fields label{font-size:12px;color:var(--muted)}.fields input,.fields select,.addrow input{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fffefa;color:var(--ink);min-width:0}.fields .wide{grid-column:1/-1}.actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.addrow{display:flex;gap:7px;margin-top:10px}.addrow input{flex:1;min-width:0}.muted{color:var(--muted)}.note{font-size:11px;line-height:1.6;color:var(--muted);margin-top:10px}.remrow{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px}.remrow b{width:48px}.remrow span{flex:1}.footer{text-align:center;font-size:11px;color:var(--muted);padding:16px 12px;letter-spacing:.08em}
@media(max-width:390px){.chartwrap{gap:8px}.chart{width:43vw}.schedule-row{grid-template-columns:91px 9px 1fr auto;gap:6px;font-size:12px}.card{padding:13px}}
</style>
</head>
<body>
<main id="app">
 <header class="top"><div><div class="eyebrow">MY WEEKLY ROUTINE</div><h1>わたしの時間割</h1></div><div class="date" id="dateLabel"></div></header>
 <nav class="days" id="days" aria-label="曜日"></nav>
 <section class="card"><div class="cardhead"><h2>24時間の過ごし方</h2><span class="sub" id="dayKind"></span></div><div class="chartwrap"><svg class="chart" id="chart" viewBox="0 0 220 220" role="img" aria-label="1日の時間配分"><circle cx="110" cy="110" r="82" fill="none" stroke="#e6e2da" stroke-width="24"/></svg><div class="legend" id="legend"></div></div><div class="note">予定の時間を編集すると、円グラフも更新されます。</div></section>
 <section class="card"><div class="cardhead"><h2>今日のチェックリスト</h2><strong id="progressText" class="sub"></strong></div><div class="progress"><span id="progressBar"></span></div><div id="tasks"></div><form id="taskForm" class="addrow"><input id="taskInput" type="text" placeholder="やることを追加" aria-label="やること"><button class="btn primary">追加</button></form><div class="actions"><button class="btn smallbtn" id="resetTasks" type="button">チェックをリセット</button></div></section>
 <section class="card"><div class="cardhead"><h2>時間割の編集</h2><button class="btn primary" id="addSlot" type="button">＋ 予定追加</button></div><div class="sub">予定を編集・削除できます。勤務日は月・火・水・金、実務日は木・土・日で初期設定しています。</div><div id="schedule"></div>
 <form id="slotForm" class="editform" hidden><div class="fields"><label>開始時間<input id="start" type="time" required></label><label>終了時間<input id="end" type="time" required></label><label class="wide">予定の内容<input id="label" type="text" required></label><label class="wide">カテゴリー<select id="category"><option value="0">朝・身支度</option><option value="1">家事</option><option value="2">メルカリ</option><option value="3">移動・リサーチ</option><option value="4">植物ショップ</option><option value="5">家族・食事</option><option value="6">運動・ストレッチ</option><option value="7">睡眠・休息</option></select></label></div><div class="actions"><button class="btn primary">保存</button><button class="btn" type="button" id="cancelSlot">キャンセル</button><button class="btn" type="button" id="deleteSlot">削除</button></div></form></section>
 <section class="card"><div class="cardhead"><h2>リマインダー</h2><button class="btn smallbtn" id="enableNotify" type="button">通知を許可</button></div><div id="reminders"></div><form id="reminderForm" class="addrow"><input id="remTime" type="time" value="20:30" style="max-width:115px"><input id="remText" type="text" placeholder="通知内容"><button class="btn primary">追加</button></form><div class="note" id="notifyStatus">通知はアプリを開いている間の予定時刻に表示します。iPhoneではホーム画面に追加したアプリで通知許可が必要です。アプリを閉じている間の定時通知は、この無料版では保証されません。</div></section>
 <div class="footer">MY LIFE ROUTINE · データはこの端末のブラウザ内に保存されます</div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id), names=['日','月','火','水','木','金','土'], colors=['#d6bda4','#91a68a','#8298a9','#c3a3a0','#b4a5c6','#d6cf9c','#91b6aa','#b6b6b6'];
const workDays=[1,2,3,5];let day=new Date().getDay(),editing=null;
const work=[
['06:30','07:00','起床・身支度',0],['07:00','08:00','朝食・家事',1],['08:00','09:00','メルカリ確認・準備',2],['09:00','09:30','出勤準備',0],['09:30','18:30','通勤・植物ショップ勤務（移動中に編集）',4],['18:30','19:30','帰宅・夕食準備',1],['19:30','20:30','夕食・家族時間',5],['20:30','21:30','メルカリ3点出品',2],['21:30','22:00','ストレッチ・お風呂',6],['22:00','23:00','自由時間・翌日準備',7],['23:00','06:30','睡眠',7]];
const practical=[
['06:30','07:00','起床・身支度',0],['07:00','08:00','朝食・家事',1],['08:00','09:00','洗濯・掃除',1],['09:00','11:00','商品撮影・採寸',2],['11:00','12:00','リサーチ・仕入れ',3],['12:00','13:00','昼食・休憩',5],['13:00','15:00','商品情報整理・出品準備',2],['15:00','16:00','家事・買い物',1],['16:00','18:00','撮影・採寸・予備作業',2],['18:00','20:30','夕食・家族時間',5],['20:30','21:00','メルカリ3点出品・確認',2],['21:00','21:30','ストレッチ',6],['21:30','22:30','お風呂・自由時間',7],['22:30','23:00','翌日の準備',1],['23:00','06:30','睡眠',7]];
const taskSeeds={work:['身支度・朝食','家事をひとつ進める','通勤中に商品説明を編集（安全に操作できる時）','植物ショップ勤務','メルカリ3点を夜に出品','コメント・売上確認','家族時間','ストレッチ','翌日の準備'],practical:['身支度・朝食','洗濯・掃除','商品撮影・採寸','商品情報を整理','メルカリ3点出品','リサーチ・仕入れ','梱包・発送','家族時間','ストレッチ','翌週の準備']};
const defaults={};for(let d=0;d<7;d++)defaults[d]= (workDays.includes(d)?work:practical).map((x,i)=>({id:'s'+i,start:x[0],end:x[1],label:x[2],cat:x[3]}));
function load(k,f){try{let v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}}
let schedules=load('mlr_schedules',defaults),tasks=load('mlr_tasks',{}),reminders=load('mlr_reminders',[['08:00','朝の準備・メルカリ確認'],['20:30','メルカリ3点出品'],['21:00','ストレッチ'],['22:30','翌日の準備']]);
function save(){localStorage.setItem('mlr_schedules',JSON.stringify(schedules));localStorage.setItem('mlr_tasks',JSON.stringify(tasks));localStorage.setItem('mlr_reminders',JSON.stringify(reminders))}
function initTasks(){if(!tasks[day])tasks[day]=(workDays.includes(day)?taskSeeds.work:taskSeeds.practical).map((label,i)=>({id:'t'+i,label,done:false}));}
function mins(t){let [h,m]=t.split(':').map(Number);return h*60+m}function dur(a,b){let n=mins(b)-mins(a);return n>0?n:n+1440}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(){initTasks();$('days').innerHTML=names.map((n,i)=>`<button type="button" data-day="${i}" class="${day===i?'active':''}">${n}</button>`).join('');$('days').querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=+b.dataset.day;editing=null;$('slotForm').hidden=true;draw()});let now=new Date();$('dateLabel').textContent=day===now.getDay()?now.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'}):'曜日を選択中';$('dayKind').textContent=workDays.includes(day)?'植物ショップ勤務日':'メルカリ実務日';drawChart();drawTasks();drawSchedule();drawReminders()}
function drawChart(){let svg=$('chart'),C=2*Math.PI*82;svg.innerHTML='<circle cx="110" cy="110" r="82" fill="none" stroke="#e6e2da" stroke-width="24"/>';let sums={};schedules[day].forEach(s=>{let d=dur(s.start,s.end),c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',110);c.setAttribute('cy',110);c.setAttribute('r',82);c.setAttribute('fill','none');c.setAttribute('stroke',colors[s.cat]);c.setAttribute('stroke-width',24);c.setAttribute('stroke-dasharray',`${C*d/1440} ${C}`);c.setAttribute('stroke-dashoffset',-C*mins(s.start)/1440);c.setAttribute('transform','rotate(-90 110 110)');svg.append(c);sums[s.cat]=(sums[s.cat]||0)+d});let t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',110);t.setAttribute('y',115);t.setAttribute('text-anchor','middle');t.setAttribute('font-size',18);t.setAttribute('fill','#343a35');t.textContent='24時間';svg.append(t);let labels=['朝・身支度','家事','メルカリ','移動・リサーチ','植物ショップ','家族・食事','運動・ストレッチ','睡眠・休息'];$('legend').innerHTML=Object.keys(sums).sort((a,b)=>a-b).map(k=>`<div class="leg"><i class="dot" style="background:${colors[k]}"></i><span>${labels[k]}</span><b>${Math.floor(sums[k]/60)}時間${sums[k]%60?sums[k]%60+'分':''}</b></div>`).join('')}
function drawTasks(){let a=tasks[day],done=a.filter(x=>x.done).length;$('progressText').textContent=`${done}/${a.length} 完了 · ${a.length?Math.round(done/a.length*100):0}%`;$('progressBar').style.width=(a.length?done/a.length*100:0)+'%';$('tasks').innerHTML=a.map((x,i)=>`<div class="task"><input type="checkbox" data-check="${i}" ${x.done?'checked':''}><label class="${x.done?'done':''}">${esc(x.label)}</label><button class="btn smallbtn" type="button" data-edit-task="${i}">編集</button><button class="btn smallbtn" type="button" data-del-task="${i}">削除</button></div>`).join('');$('tasks').querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{a[+b.dataset.check].done=b.checked;save();drawTasks()});$('tasks').querySelectorAll('[data-del-task]').forEach(b=>b.onclick=()=>{a.splice(+b.dataset.delTask,1);save();drawTasks()});$('tasks').querySelectorAll('[data-edit-task]').forEach(b=>b.onclick=()=>{let x=a[+b.dataset.editTask],v=prompt('タスク名を編集',x.label);if(v&&v.trim()){x.label=v.trim();save();drawTasks()}})}
function drawSchedule(){$('schedule').innerHTML=schedules[day].map((s,i)=>`<div class="schedule-row"><span class="time">${s.start}–${s.end}</span><i class="dot" style="background:${colors[s.cat]}"></i><span>${esc(s.label)}</span><button class="btn smallbtn" data-edit-slot="${i}" type="button">編集</button></div>`).join('');$('schedule').querySelectorAll('[data-edit-slot]').forEach(b=>b.onclick=()=>openSlot(+b.dataset.editSlot))}
function openSlot(i){editing=i;let s=i===null?{start:'12:00',end:'13:00',label:'新しい予定',cat:1}:schedules[day][i];$('start').value=s.start;$('end').value=s.end;$('label').value=s.label;$('category').value=s.cat;$('deleteSlot').hidden=i===null;$('slotForm').hidden=false}
$('addSlot').onclick=()=>openSlot(null);$('cancelSlot').onclick=()=>{$('slotForm').hidden=true};$('slotForm').onsubmit=e=>{e.preventDefault();let s={id:editing===null?Date.now():schedules[day][editing].id,start:$('start').value,end:$('end').value,label:$('label').value.trim(),cat:+$('category').value};if(!s.label||s.start===s.end){alert('内容を入力し、開始と終了を異なる時刻にしてください。');return}if(editing===null)schedules[day].push(s);else schedules[day][editing]=s;schedules[day].sort((a,b)=>mins(a.start)-mins(b.start));save();$('slotForm').hidden=true;drawSchedule();drawChart()};$('deleteSlot').onclick=()=>{if(editing!==null)schedules[day].splice(editing,1);save();$('slotForm').hidden=true;drawSchedule();drawChart()};
$('taskForm').onsubmit=e=>{e.preventDefault();let v=$('taskInput').value.trim();if(!v)return;tasks[day].push({id:Date.now(),label:v,done:false});$('taskInput').value='';save();drawTasks()};$('resetTasks').onclick=()=>{tasks[day].forEach(x=>x.done=false);save();drawTasks()};
function drawReminders(){$('reminders').innerHTML=reminders.map((x,i)=>`<div class="remrow"><b>${x[0]}</b><span>${esc(x[1])}</span><button class="btn smallbtn" data-del-rem="${i}" type="button">削除</button></div>`).join('');$('reminders').querySelectorAll('[data-del-rem]').forEach(b=>b.onclick=()=>{reminders.splice(+b.dataset.delRem,1);save();drawReminders()})}
$('reminderForm').onsubmit=e=>{e.preventDefault();let v=$('remText').value.trim();if(!v)return;reminders.push([$ ('remTime').value,v]);reminders.sort((a,b)=>a[0].localeCompare(b[0]));$('remText').value='';save();drawReminders()};
$('enableNotify').onclick=async()=>{if(!('Notification'in window)){alert('この環境ではブラウザ通知に対応していません。ホーム画面に追加したアプリでお試しください。');return}let p=await Notification.requestPermission();$('notifyStatus').textContent=p==='granted'?'通知が許可されました。アプリを開いている間、設定時刻に通知します。':'通知は許可されていません。iPhoneの設定も確認してください。'};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
let fired=new Set();function checkReminders(){if(!('Notification'in window)||Notification.permission!=='granted'||document.visibilityState!=='visible')return;let now=new Date(),stamp=now.toDateString()+'-'+now.getHours()+':'+now.getMinutes();if(fired.has(stamp))return;fired.add(stamp);let hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');reminders.filter(x=>x[0]===hm).forEach(x=>new Notification('MY LIFE ROUTINE',{body:x[1]}))}setInterval(checkReminders,15000);
draw();
})();
</script>
</body></html>
